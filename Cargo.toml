[package]
name = "sal"
version = "0.1.0"
edition = "2021"
description = "Bootstrap compiler for the sal language"

[[bin]]
name = "sal"
path = "src/main.rs"

[[bin]]
name = "standard"
path = "src/bin/standard.rs"

[lib]
name = "sal_compiler"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
