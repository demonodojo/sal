[package]
name = "sal"
version = "0.1.0"
edition = "2021"
description = "Bootstrap compiler for the sal language"

[[bin]]
name = "sal"
path = "src/main.rs"

[[bin]]
name = "standard"
path = "src/bin/standard.rs"

[[bin]]
name = "som2salt"
path = "src/bin/som2salt.rs"

[lib]
name = "sal_compiler"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
sosomodel = { path = "../soso/crates/sosomodel", features = ["std"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("soso"))'] }

[build-dependencies]
sha2 = "0.10"
